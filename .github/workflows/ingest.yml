name: Collect articles

# Collects NYC news, screens it with the model, and files it for review.
#
# Runs every afternoon, and on demand — the dashboard's "Collect new articles"
# button triggers this same workflow rather than spawning a local process.
#
# The model runs ON THE RUNNER by default: Ollama is installed, the weights are
# restored from cache, and everything disappears when the job ends. Nothing is
# running — or being paid for — the rest of the week, and no model is exposed
# to the internet.
#
# Setting the OLLAMA_URL secret switches to a hosted instance instead.
on:
  schedule:
    # 17:10 America/New_York. GitHub cron is UTC and does not follow daylight
    # saving, so this is scheduled twice — once correct in EDT, once in EST —
    # and the gate below lets through whichever matches today's offset.
    #
    # Keep both lines consistent with LOCAL_TIME in the job env: the gate
    # derives the correct one from it, so changing the time means changing all
    # three. Minute 10 rather than 0 is deliberate — GitHub documents the top
    # of the hour as its highest-load window, and these runs already queue for
    # hours behind it.
    - cron: "10 21 * * *"   # 17:10 EDT
    - cron: "10 22 * * *"   # 17:10 EST
  workflow_dispatch:
    inputs:
      limit:
        description: "Review at most this many new articles (blank = all)"
        required: false
        type: string
      date:
        description: "Keep only articles that appeared on this day (YYYY-MM-DD, blank = the whole lookback window)"
        required: false
        type: string
      request_id:
        description: "Set by the dashboard so it can find this run. Leave blank when running by hand."
        required: false
        type: string

# The dispatch endpoint returns 204 with no body, so the dashboard cannot learn
# the run's id from the response. Stamping the request id into the run name
# gives it something to match on — far more reliable than "the newest run",
# which races with the daily schedule and with a second click.
run-name: >-
  Collect ${{ inputs.date && format('for {0}', inputs.date) || 'latest' }}
  ${{ inputs.request_id && format('[{0}]', inputs.request_id) || '' }}

concurrency:
  # Two collections at once would duplicate every fetch and race on inserts.
  group: hestia-ingest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Generous: a cold model pull plus screening on runner CPU.
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # A small model. The runner has no GPU, and an 8B model spends far longer
      # per article for judgement that is not obviously better at this task.
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
      # The local time the daily collection is scheduled for. Must match the
      # two cron lines above.
      LOCAL_TIME: "17:10"
      LLM_TIMEOUT: "300"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      # A scheduled run fires on both cron lines, but only one of them lands on
      # LOCAL_TIME in the newsroom's zone. A dispatched run always proceeds.
      #
      # This keys off WHICH cron line fired, not off the clock. github.event
      # .schedule is fixed when the run is created, so it survives any delay —
      # and GitHub's scheduler is routinely hours late here. The previous
      # version asked "is it 06:00 right now?", which is only true if the job
      # starts on time; it never was, so 60 consecutive scheduled runs skipped
      # the collection and reported success in 20 seconds.
      - name: Should this run proceed?
        id: gate
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # A dispatched run — the dashboard button, or the Actions tab.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Which UTC hour is LOCAL_TIME here today? 21 on EDT, 22 on EST.
          want=$(TZ=UTC date -d "TZ=\"$TIMEZONE\" $LOCAL_TIME" +%-H)
          # "10 21 * * *" -> "21". Field 2 of a cron expression is the hour.
          fired=$(printf '%s' "${FIRED:-}" | awk '{print $2}')

          # Fail open on anything unexpected. A duplicate run costs runner
          # minutes and inserts nothing — deduplication drops what is already
          # stored before the model is called. A skipped run costs a day of
          # news. The old gate failed closed, which is why it was invisible.
          if ! printf '%s' "$fired" | grep -Eq '^[0-9]{1,2}$'; then
            echo "No usable cron hour in the event payload (schedule='${FIRED:-}') — collecting rather than skipping."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 10# because $((08)) is an octal parse error, not 8.
          if [ "$((10#$fired))" -eq "$((10#$want))" ]; then
            echo "Fired by the ${fired}:00 UTC line, which is $LOCAL_TIME in $TIMEZONE today."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fired by the ${fired}:00 UTC line, but $LOCAL_TIME in $TIMEZONE is ${want}:00 UTC today — the other line does this run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # A secret cannot be read in an `if:` condition, so turn it into an output.
      - name: Where does the model run?
        id: model
        if: steps.gate.outputs.run == 'true'
        env:
          REMOTE_URL: ${{ secrets.OLLAMA_URL }}
        run: |
          if [ -n "$REMOTE_URL" ]; then
            echo "mode=remote" >> "$GITHUB_OUTPUT"
            echo "Using the hosted model at the configured URL."
          else
            echo "mode=runner" >> "$GITHUB_OUTPUT"
            echo "Running the model on this runner — nothing to host or pay for."
          fi

      # Weights are several GB. Caching turns a ~2 minute download into seconds,
      # and a daily run keeps the entry from being evicted.
      - name: Restore the model
        if: steps.model.outputs.mode == 'runner'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-v1

      - name: Start Ollama on the runner
        if: steps.model.outputs.mode == 'runner'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The install script starts a service on some images and not others;
          # starting it here either way is harmless.
          (ollama serve > /tmp/ollama.log 2>&1 &)

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "Ollama did not come up. Log:" >&2
            tail -40 /tmp/ollama.log >&2
            exit 1
          fi

          echo "Pulling $OLLAMA_MODEL (cached after the first run)..."
          start=$(date +%s)
          ollama pull "$OLLAMA_MODEL"
          echo "Model ready in $(( $(date +%s) - start ))s."

          # Point the worker at the runner's own instance.
          echo "OLLAMA_URL=http://127.0.0.1:11434" >> "$GITHUB_ENV"

      - name: Use the hosted model
        if: steps.model.outputs.mode == 'remote'
        env:
          REMOTE_URL: ${{ secrets.OLLAMA_URL }}
          REMOTE_TOKEN: ${{ secrets.OLLAMA_AUTH_TOKEN }}
        run: |
          echo "OLLAMA_URL=$REMOTE_URL" >> "$GITHUB_ENV"
          echo "OLLAMA_AUTH_TOKEN=$REMOTE_TOKEN" >> "$GITHUB_ENV"

      - name: Check connections
        if: steps.gate.outputs.run == 'true'
        run: python worker/scripts/ingest.py --check

      # --review require: the scheduled job stops rather than filing a whole
      # day unscored, which would bury the queue. The button degrades instead.
      - name: Collect and screen
        if: steps.gate.outputs.run == 'true'
        # The input goes through the environment rather than being interpolated
        # into the script. A ${{ }} expression inside a run block is pasted in
        # as raw text before the shell sees it, so anything in it executes.
        env:
          LIMIT: ${{ inputs.limit }}
          FOR_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          args="--review require"

          if [ -n "${LIMIT:-}" ]; then
            printf '%s' "$LIMIT" | grep -Eq '^[0-9]+$' || {
              echo "limit must be a whole number, got: $LIMIT" >&2
              exit 1
            }
            args="$args --limit $LIMIT"
          fi

          # Validated here as well as in the dashboard: a workflow can also be
          # dispatched by hand from the Actions tab, where nothing checked it.
          if [ -n "${FOR_DATE:-}" ]; then
            printf '%s' "$FOR_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || {
              echo "date must be YYYY-MM-DD, got: $FOR_DATE" >&2
              exit 1
            }
            args="$args --for-date $FOR_DATE"
          fi

          start=$(date +%s)
          # shellcheck disable=SC2086  # args is built from validated tokens only
          python worker/scripts/ingest.py $args
          echo "Run took $(( ($(date +%s) - start) / 60 )) minutes."
